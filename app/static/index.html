<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galaxy — Space Object Explorer</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">SPACE OBJECT EXPLORER</p>
      <h1>🌌 Galaxy</h1>
      <p class="subtitle">Type the name of a space object and pull together public astronomy data.</p>
    </header>

    <section class="search-card">
      <form id="search-form">
        <input id="query" name="q" autocomplete="off"
               placeholder="Try: Apophis, Bennu, Mars..." minlength="2" required>
        <button type="submit">Explore</button>
      </form>
      <p class="hint">Powered by public NASA and JPL endpoints.</p>
    </section>

    <section id="status" class="status"></section>
    <section id="results" class="results"></section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
