<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galaxy — Space Intelligence</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">SPACE INTELLIGENCE • V3</p>
      <h1>🌌 Galaxy</h1>
      <p class="subtitle">Search anything space-related — objects, missions, discoveries, spacecraft, astronomy topics, and more.</p>
    </header>
    <section class="search-card">
      <form id="search-form">
        <input id="query" name="q" autocomplete="off" placeholder="Try: Mars, Voyager 1, Andromeda, Kepler-452b..." minlength="2" required>
        <button type="submit">Explore →</button>
      </form>
      <div class="examples">
        <button type="button" data-query="Mars">Mars</button>
        <button type="button" data-query="Bennu">Bennu</button>
        <button type="button" data-query="Andromeda Galaxy">Andromeda</button>
        <button type="button" data-query="Voyager 1">Voyager 1</button>
        <button type="button" data-query="Kepler-452b">Kepler-452b</button>
      </div>
      <p class="hint">NASA • JPL • NASA Exoplanet Archive • NASA Images • Wikipedia</p>
    </section>
    <section id="status" class="status"></section>
    <section id="results" class="results"></section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
